services:
  selb-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    develop:
      watch:
        - action: sync+restart     # server code: copy in + restart Node
          path: ./src
          target: /build/src
        - action: sync+restart     # views
          path: ./views
          target: /build/views  
        - action: sync             # html/css/browser js: just copy in
          path: ./public
          target: /build/public
        - action: rebuild          # new npm package: rebuild the image
          path: package.json

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    command: --wait --no-dump-schema up
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - selb-app

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: